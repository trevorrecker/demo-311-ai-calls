<!doctype html>
<html lang="en" data-variant="experimental" data-asset-base="/">
<head>
  <meta charset="utf-8">
  <base href="/experimental/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>311 Request Desk · Experimental</title>
  <link rel="icon" href="/assets/311.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">311</span>
      <h1>Request Desk</h1>
    </div>
    <nav class="variant-nav" aria-label="AI Call label">
      <a href="/">Stable</a>
      <a href="/experimental/" aria-current="page">Experimental</a>
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="desk">
    <section class="card intake" aria-labelledby="intake-title">
      <h2 id="intake-title">New service request</h2>

      <form id="request-form" novalidate>
        <div class="field">
          <div class="field-row">
            <label for="neighborhood">Neighborhood</label>
            <span class="counter" id="neighborhood-count" aria-hidden="true">0/100</span>
          </div>
          <input id="neighborhood" name="neighborhood" type="text" maxlength="100" autocomplete="off"
                 placeholder="e.g. Astoria, Queens" aria-describedby="neighborhood-error">
          <p class="field-error" id="neighborhood-error" hidden></p>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="report">What did you see?</label>
            <span class="counter" id="report-count" aria-hidden="true">0/1200</span>
          </div>
          <textarea id="report" name="report" rows="6" maxlength="1200"
                    placeholder="Describe the problem, where it is on the block, and why it matters."
                    aria-describedby="report-error"></textarea>
          <p class="field-error" id="report-error" hidden></p>
        </div>

        <div class="field">
          <div class="field-row">
            <span class="label" id="photo-label">Photo <span class="optional">optional</span></span>
          </div>
          <div class="photo" id="photo-zone" aria-labelledby="photo-label">
            <div class="photo-empty" id="photo-empty">
              <svg class="photo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
              <button type="button" class="link-button" id="photo-choose">Choose a photo</button>
              <span>or drop one here</span>
            </div>
            <div class="photo-filled" id="photo-filled" hidden>
              <img id="photo-preview" alt="Attached photo preview">
              <div class="photo-meta">
                <p class="photo-name" id="photo-name"></p>
                <p class="photo-size" id="photo-size"></p>
                <div class="photo-actions">
                  <button type="button" class="link-button" id="photo-replace">Replace</button>
                  <button type="button" class="link-button danger" id="photo-remove">Remove</button>
                </div>
              </div>
            </div>
            <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          </div>
          <p class="field-error" id="photo-error" role="alert" hidden></p>
        </div>

        <div class="actions">
          <button type="submit" class="primary" id="assess">
            <span class="spinner" aria-hidden="true"></span>
            <span id="assess-label">Assess</span>
            <kbd class="assess-kbd" id="assess-kbd" aria-hidden="true">&#8984;&#8629;</kbd>
          </button>
          <button type="button" class="quiet" id="load-sample">Load sample</button>
          <button type="button" class="quiet" id="clear-form">Clear</button>
        </div>
      </form>
    </section>

    <section class="card result" aria-labelledby="result-title">
      <div class="result-head">
        <h2 id="result-title">Assessment</h2>
        <span class="run-label" id="run-label"></span>
      </div>

      <div class="sr-only" id="live" aria-live="polite"></div>

      <p class="change-note" id="change-note" hidden>
        <span id="change-text"></span>
        <button type="button" class="link-button" id="compare-toggle" aria-expanded="false" aria-controls="compare">Compare</button>
      </p>

      <div class="error" id="error" role="alert" hidden>
        <p class="error-title" id="error-title"></p>
        <p class="error-message" id="error-message"></p>
        <p class="error-code" id="error-code"></p>
      </div>

      <div class="result-body" id="result-body">
        <p class="empty" id="empty">Fill in the request and choose Assess.</p>
        <article class="sections" id="assessment" hidden></article>
        <p class="pending" id="pending" hidden><span class="pending-spinner" aria-hidden="true"></span>Assessing&hellip; <span class="elapsed" id="elapsed">0.0s</span></p>
      </div>

      <p class="meta" id="meta" hidden></p>

      <div class="compare" id="compare" hidden>
        <p class="compare-title" id="compare-title"></p>
        <article class="sections" id="compare-body"></article>
      </div>

      <section class="insights" id="insights" aria-labelledby="insights-title" hidden>
        <div class="insights-head">
          <h3 id="insights-title">Insights</h3>
          <span class="run-label" id="insights-label"></span>
          <button type="button" class="secondary" id="insights-run">
            <span class="spinner" aria-hidden="true"></span>
            <span id="insights-run-label">More insights</span>
            <span class="elapsed" id="insights-elapsed" hidden>0.0s</span>
          </button>
        </div>
        <p class="insights-note" id="insights-note" hidden></p>
        <div class="error" id="insights-error" role="alert" hidden>
          <p class="error-title" id="insights-error-title"></p>
          <p class="error-message" id="insights-error-message"></p>
          <p class="error-code" id="insights-error-code"></p>
        </div>
        <article class="sections" id="insights-body" hidden></article>
        <p class="meta" id="insights-meta" hidden></p>
      </section>

      <nav class="history" id="history" aria-label="Runs this session" hidden>
        <span class="history-title">Runs</span>
        <ol class="history-list" id="history-list"></ol>
      </nav>
    </section>
  </main>
</body>
</html>
